<!DOCTYPE html>

<head>

    <title>Download NextLevel eSports App</title>
    <style>
        :root {
            --bg-main: #05080f;
            --card-bg: #0b101d;
            --card-border: #1e293b;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        .download-container {
            width: 100%;

            border: 1px solid rgba(245, 158, 11, 0.3);

            text-align: center;
            animation: fadeInScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .esports-logo-badge {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin: 0 auto 20px auto;
            transform: rotate(-5deg);
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: rotate(-5deg) translateY(0); }
            50% { transform: rotate(-5deg) translateY(-6px); }
        }

        .logo-icon {
            font-size: 36px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 900;
            color: white;
            letter-spacing: 2px;
            margin: 0 0 4px 0;
        }

        .app-subtitle {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .hero-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 28px;
            text-align: left;
        }

        .feature-box {
            background: #05080f;
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-icon {
            font-size: 18px;
        }

        .feature-text {
            font-size: 11px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }

        .download-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #05080f;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: all 0.3s ease;
            box-sizing: border-box;
            margin-bottom: 14px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.4);
        }

        .download-btn:active {
            transform: scale(0.97);
        }

        .app-info-footer {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .info-pill {
            background: #05080f;
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            border-radius: 8px;
        }
    </style>
</head>
